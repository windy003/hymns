<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>管理员登录 - 赞美诗</title>

    <link rel="apple-touch-icon" sizes="2048x2048" href="{{ url_for('static', filename='2048x2048.png',v='1') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='2048x2048.png',v='1') }}">

    <style>
        :root {
            --bg-card: white;
            --text-primary: #333;
            --text-secondary: #555;
            --text-muted: #666;
            --border-color: #e0e0e0;
            --info-bg: #f0f0f0;
            --accent-color: #667eea;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-card: #2a2a2a;
                --text-primary: #fff;
                --text-secondary: #ccc;
                --text-muted: #999;
                --border-color: #4a4a4a;
                --info-bg: #3a3a3a;
                --accent-color: #667eea;
                --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--accent-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: var(--bg-card);
            color: var(--text-primary);
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-login:hover { transform: translateY(-2px); }
        .btn-login:active { transform: translateY(0); }

        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 5px;
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: var(--info-bg);
            border-radius: 5px;
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
        }

        .info a { color: var(--accent-color); text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>管理员登录</h1>
        <p class="subtitle">仅限管理员账号登录后台</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-login">登录后台</button>
        </form>

        <div class="info">
            <a href="{{ url_for('login') }}">返回普通登录</a>
        </div>
    </div>
</body>
</html>
