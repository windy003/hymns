<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 赞美诗</title>
    
    <link rel="apple-touch-icon" sizes="2048x2048" href="{{ url_for('static', filename='2048x2048.png') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='2048x2048.png') }}">
    
    
    
    <style>
        /* 主题颜色变量定义 */
        :root {
            --bg-card: white;
            --text-primary: #333;
            --text-secondary: #555;
            --text-muted: #666;
            --border-color: #e0e0e0;
            --info-bg: #f0f0f0;
            --accent-color: #667eea;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --highlight-bg: #fff8e1;
            --highlight-border: #ffe082;
            --highlight-text: #8a6d00;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-card: #2a2a2a;
                --text-primary: #fff;
                --text-secondary: #ccc;
                --text-muted: #999;
                --border-color: #4a4a4a;
                --info-bg: #3a3a3a;
                --accent-color: #667eea;
                --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                --highlight-bg: #3a3320;
                --highlight-border: #5c4e1a;
                --highlight-text: #ffd54f;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--accent-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"],
        input[type="tel"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: var(--bg-card);
            color: var(--text-primary);
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 5px;
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: var(--info-bg);
            border-radius: 5px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .info p {
            margin: 5px 0;
        }

        .highlight {
            background: var(--highlight-bg);
            border: 1px solid var(--highlight-border);
            color: var(--highlight-text);
        }

        .login-tabs { display: flex; gap: 8px; margin-bottom: 22px; }
        .login-tabs button { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--info-bg); color: var(--text-secondary); font-size: 15px; cursor: pointer; }
        .login-tabs button.active { background: var(--accent-gradient); color: white; border-color: transparent; }
        .code-row { display: flex; gap: 8px; }
        .code-row input { min-width: 0; flex: 1; }
        .btn-code { flex-shrink: 0; border: 0; border-radius: 5px; padding: 0 12px; color: white; background: var(--accent-color); cursor: pointer; }
        .auth-panel[hidden] { display: none; }
        #sms-status { margin-top: 8px; font-size: 13px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>赞美诗</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="login-tabs" role="tablist" aria-label="登录方式">
            <button type="button" class="{{ 'active' if active_method == 'phone' }}" id="phoneTab" role="tab" aria-selected="{{ 'true' if active_method == 'phone' else 'false' }}">短信登录</button>
            <button type="button" class="{{ 'active' if active_method != 'phone' }}" id="passwordTab" role="tab" aria-selected="{{ 'true' if active_method != 'phone' else 'false' }}">用户名密码</button>
        </div>

        <form method="POST" class="auth-panel" id="passwordPanel" {{ 'hidden' if active_method == 'phone' }}>
            <input type="hidden" name="auth_method" value="password">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required {{ 'autofocus' if active_method != 'phone' }}>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn-login">登录</button>
        </form>

        <form method="POST" class="auth-panel" id="phonePanel" {{ 'hidden' if active_method != 'phone' }}>
            <input type="hidden" name="auth_method" value="phone">
            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" name="phone" inputmode="numeric" autocomplete="tel" pattern="1[3-9][0-9]{9}" maxlength="11" placeholder="手机号" required {{ 'autofocus' if active_method == 'phone' }}>
            </div>
            <div class="form-group">
                <label for="verify_code">短信验证码</label>
                <div class="code-row">
                    <input type="text" id="verify_code" name="verify_code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="输入验证码" required>
                    <button type="button" class="btn-code" id="sendCodeButton">获取验证码</button>
                </div>
                <div id="sms-status" aria-live="polite"></div>
            </div>
            <button type="submit" class="btn-login">短信登录</button>
        </form>

        <div class="info highlight">
            <p>手机号登录,也要向站长:周秋良,付款100元,设置批准同意才可以，微信号：'trust030703'</p>
        </div>

    </div>
    <script>
        const passwordTab = document.getElementById('passwordTab');
        const phoneTab = document.getElementById('phoneTab');
        const passwordPanel = document.getElementById('passwordPanel');
        const phonePanel = document.getElementById('phonePanel');
        function selectLogin(method) {
            const isPhone = method === 'phone';
            passwordPanel.hidden = isPhone;
            phonePanel.hidden = !isPhone;
            passwordTab.classList.toggle('active', !isPhone);
            phoneTab.classList.toggle('active', isPhone);
            passwordTab.setAttribute('aria-selected', String(!isPhone));
            phoneTab.setAttribute('aria-selected', String(isPhone));
        }
        passwordTab.addEventListener('click', () => selectLogin('password'));
        phoneTab.addEventListener('click', () => selectLogin('phone'));

        const sendButton = document.getElementById('sendCodeButton');
        sendButton.addEventListener('click', async () => {
            const phone = document.getElementById('phone').value.trim();
            const status = document.getElementById('sms-status');
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                status.textContent = '请输入有效的手机号';
                return;
            }
            sendButton.disabled = true;
            status.textContent = '正在发送…';
            try {
                const response = await fetch('{{ url_for("login_send_code") }}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ phone })
                });
                const result = await response.json();
                status.textContent = result.message;
                if (response.ok) {
                    let remaining = 60;
                    sendButton.textContent = `${remaining} 秒后重试`;
                    const timer = setInterval(() => {
                        remaining -= 1;
                        if (remaining <= 0) {
                            clearInterval(timer);
                            sendButton.disabled = false;
                            sendButton.textContent = '获取验证码';
                        } else {
                            sendButton.textContent = `${remaining} 秒后重试`;
                        }
                    }, 1000);
                } else {
                    sendButton.disabled = false;
                }
            } catch (_) {
                status.textContent = '验证码发送失败，请稍后再试';
                sendButton.disabled = false;
            }
        });
    </script>
</body>
</html>
