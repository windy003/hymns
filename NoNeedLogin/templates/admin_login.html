<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 赞美诗</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='2048x2048.png') }}?v=2">
    <style>
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: white;
            --text-primary: #333;
            --text-secondary: #555;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --accent-color: #667eea;
            --accent-hover: #5568d3;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --error-bg: #fdecea;
            --error-text: #c0392b;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2a2a2a;
                --text-primary: #fff;
                --text-secondary: #ccc;
                --border-color: #4a4a4a;
                --shadow-color: rgba(0, 0, 0, 0.3);
                --accent-color: #667eea;
                --accent-hover: #7b8ff0;
                --error-bg: #4a2a2a;
                --error-text: #ff8a80;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: var(--bg-secondary);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-color);
            padding: 40px 32px;
            width: 100%;
            max-width: 360px;
        }

        .login-box h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .flash {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            background: var(--bg-primary);
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: var(--accent-gradient);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.92;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>管理员登录</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="password" name="password" placeholder="请输入管理员密码" autofocus required>
            <button type="submit">登录</button>
        </form>
    </div>
</body>
</html>
